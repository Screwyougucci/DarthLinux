name: Darth Mobile N112 firmware extraction check

on:
  push:
    branches:
      - mobile/ipod-touch-7
    paths:
      - "mobile/ipod-touch-7/firmware-tools/**"
      - "mobile/ipod-touch-7/scripts/S30hx-touchd.sh"
      - "mobile/ipod-touch-7/scripts/S99darth-ui.sh"
      - ".github/workflows/darth-mobile-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darth-mobile-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev
          python -m venv "$RUNNER_TEMP/firmware-venv"
          "$RUNNER_TEMP/firmware-venv/bin/pip" install -r mobile/ipod-touch-7/firmware-tools/requirements.txt
      - name: Validate mobile init script syntax
        run: |
          sh -n mobile/ipod-touch-7/scripts/S30hx-touchd.sh
          sh -n mobile/ipod-touch-7/scripts/S99darth-ui.sh
      - name: List IPSW disk-image entries
        run: |
          URL="https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-76865/68174A8B-44B2-4689-B8D4-C8F42F4FFBEE/iPodtouch_7_15.8.8_19H422_Restore.ipsw"
          "$RUNNER_TEMP/firmware-venv/bin/python" mobile/ipod-touch-7/firmware-tools/ipswget.py "$URL" list "*.dmg"
      - name: Extract N112 firmware using HTTP range requests
        run: |
          "$RUNNER_TEMP/firmware-venv/bin/python" \
            mobile/ipod-touch-7/firmware-tools/extract-n112-firmware.py \
            --output "$RUNNER_TEMP/N112.mtprops"
      - name: Verify output without publishing proprietary firmware
        run: |
          test -s "$RUNNER_TEMP/N112.mtprops"
          sha256sum "$RUNNER_TEMP/N112.mtprops"
          rm -f "$RUNNER_TEMP/N112.mtprops"
