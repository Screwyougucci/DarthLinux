name: Build Darth Linux ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.sh"
      - "profiles/**"
      - "tools/**"
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: darth-linux-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show available disk
        run: df -h

      - name: Build in a privileged Arch Linux container
        run: |
          docker pull archlinux:latest
          docker run --privileged --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm archiso git python
              python -m py_compile \
                tools/darth-ai-manager tools/darth-audit tools/darth-center \
                tools/darth-control-center tools/darth-driver-manager \
                tools/darth-hwcheck tools/darth-privacy tools/darth-proxy \
                tools/darth-recovery tools/darth-scope-scan tools/darth-sentinel \
                tools/darth-settings tools/darth-store tools/darth-watchtower
              for f in tools/darth-av-scan tools/darth-guardian tools/darth-lockdown tools/darth-redlab; do bash -n "$f"; done
              bash -n build.sh scripts/install-custom-tools.sh scripts/install-security-tools.sh
              python tools/darth-hwcheck --self-test
              bash ./build.sh
              test -n "$(find out -maxdepth 1 -type f -name "*.iso" -print -quit)"
              sha256sum out/*.iso > out/SHA256SUMS
            '

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darth-linux-live-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
