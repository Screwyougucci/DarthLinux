#!/usr/bin/nft -f
# Darth owns only this table; never flush rules owned by other applications.
destroy table inet darth_filter

table inet darth_filter {
  chain input {
    type filter hook input priority filter; policy drop;
    iifname "lo" accept
    # Permit guests on libvirt's default bridge to reach host-side DHCP/DNS.
    iifname "virbr*" accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto { icmp, ipv6-icmp } accept
  }
  # Do not install a blanket forward drop: it breaks libvirt guest networking.
  # Libvirt and other virtualization managers manage their own forwarding rules.
  chain output { type filter hook output priority filter; policy accept; }
}
